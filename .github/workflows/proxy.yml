name: CH WireGuard Client

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Inštalácia WireGuardu
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard curl

      - name: 2. Vytvorenie WireGuard profilu
        run: |
          sudo tee /etc/wireguard/wg0.conf > /dev/null << 'EOF'
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 10.2.0.2/32, 2a07:b944::2:2/128
          DNS = 10.2.0.1, 2a07:b944::2:1

          [Peer]
          PublicKey = MDJPYLKrGYv11Mis97Ihk/aPULhC5us44hx3Fa1/8lk=
          AllowedIPs = 0.0.0.0/0, ::/0
          Endpoint = 149.88.27.233:51820
          PersistentKeepalive = 25
          EOF

          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: 3. Spustenie CH WireGuard tunela
        run: |
          sudo wg-quick up wg0
          sleep 5

      - name: 4. Kontrola WireGuard spojenia
        run: |
          sudo wg show
          echo "Verejná IP cez WireGuard:"
          curl --interface wg0 https://api.ipify.org
          echo

      - name: 5. Odoslanie dát cez CH VPN
        run: |
          curl --interface wg0 \
            --fail \
            --data-binary @data.bin \
            https://tvoj-ciel.example/upload

      - name: 6. Vypnutie WireGuardu
        if: always()
        run: |
          sudo wg-quick down wg0 || true
