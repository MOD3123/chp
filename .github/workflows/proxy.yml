name: Nonstop CH WireGuard Proxy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Automatický reštart každých 6 hodín pre nonstop beh

jobs:
  run-proxy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Inštalácia WireGuardu, socat a ngrok
      run: |
        sudo apt-get update
        sudo apt-get install -y wireguard openresolv socat
        curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install ngrok

    - name: 2. Bezpečný zápis WireGuard profilu z vášho zadania
      run: |
        cat << 'EOF' > wg0.conf
        [Interface]
        PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
        Address = 10.2.0.2/32, 2a07:b944::2:2/128
        DNS = 10.2.0.1, 2a07:b944::2:1

        [Peer]
        PublicKey = MDJPYLKrGYv11Mis97Ihk/aPULhC5us44hx3Fa1/8lk=
        AllowedIPs = 0.0.0.0/0, ::/0
        Endpoint = 149.88.27.233:51820
        PersistentKeepalive = 25
        EOF
        sudo cp wg0.conf /etc/wireguard/wg0.conf

    - name: 3. Spustenie švajčiarskeho WireGuard tunela
      run: |
        sudo wg-quick up wg0
        sleep 5
        echo "Overenie IP adresy (musí ukázať Švajčiarsko):"
        curl --interface wg0 ifconfig.me

    - name: 4. Aktivácia ngrok tunela
      run: ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

    - name: 5. Spustenie HTTPS-to-HTTPS smerovania (Nonstop)
      run: |
        # ZAMEŇTE "tvoja-cielova-url-vo-svajciarsku.ch" za reálny cieľ, kam posielate dáta
        socat TCP-LISTEN:8080,fork,bind=127.0.0.1 TCP:tvoja-cielova-url-vo-svajciarsku.ch:443 &
        ngrok http 8080
